<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimplePDF - PDF to JPG</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>

<header>
<button id="themeToggle" class="theme-toggle">🌙</button>

<div class="container">
<h1>SimplePDF</h1>
<p>Fast • Secure • Browser Based</p>
</div>
</header>

<main class="container">

<section class="upload-card">
<div id="dropArea" class="drop-area">
<div class="upload-icon">📄</div>

<h2>Drop your PDF here</h2>

<p>or</p>

<label class="btn" for="pdfFile">Choose PDF</label>

<input id="pdfFile" type="file" accept="application/pdf" hidden>

<small>Maximum file size depends on your browser.</small>
</div>
</section>

<section id="loadingSection" class="loading hidden">
<div class="spinner"></div>
<h3 id="progressText">Preparing...</h3>
</section>

<section id="previewSection" class="hidden">

<div class="preview-header">

<div>
<h2>Preview</h2>
<small id="totalPages"></small>
</div>

<button id="downloadAll" class="btn secondary">
Download All JPG
</button>

</div>

<div id="previewGrid" class="preview-grid"></div>

</section>

</main>

<footer>
<p>© 2026 SimplePDF</p>
<small>Fast • Secure • Browser Based</small>
</footer>

<script src="script.js"></script>

</body>
</html>
